<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - ShopEase</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo">ShopEase</a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="cart.html" class="cart-icon">
                🛒 <span id="cart-count" class="hidden">0</span>
            </a>
            <span class="auth-logged-in hidden">
                <a href="orders.html">My Orders</a>
                <a href="#" id="logout-btn">Logout</a>
            </span>
        </div>
    </nav>

    <main>
        <h1>Checkout</h1>
        <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 2rem;">
            
            <div style="background-color: var(--white); padding: 2rem; border-radius: var(--border-radius); box-shadow: var(--shadow-sm);">
                <h2>Shipping & Payment</h2>
                <p class="mb-2 text-light">This is a simulated checkout. No real payment is required.</p>
                
                <form id="checkout-form">
                    <div id="checkout-error" class="alert alert-error hidden"></div>
                    
                    <div class="form-group">
                        <label for="address">Shipping Address</label>
                        <input type="text" id="address" class="form-control" placeholder="123 Main St" required>
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                        <div class="form-group">
                            <label for="city">City</label>
                            <input type="text" id="city" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label for="zip">Zip Code</label>
                            <input type="text" id="zip" class="form-control" required>
                        </div>
                    </div>
                    
                    <hr style="margin: 2rem 0; border: none; border-top: 1px solid var(--border-color);">
                    
                    <div class="form-group">
                        <label for="card">Credit Card Number</label>
                        <input type="text" id="card" class="form-control" placeholder="0000 0000 0000 0000" required>
                    </div>
                    
                    <button type="submit" id="place-order-btn" class="btn btn-primary btn-block">Place Order</button>
                </form>
            </div>

            <div id="checkout-summary" style="background-color: var(--white); padding: 2rem; border-radius: var(--border-radius); box-shadow: var(--shadow-sm); align-self: start;">
                <!-- Summary generated by JS -->
            </div>
            
        </div>
    </main>

    <footer>
        <p>&copy; 2026 ShopEase. CodeAlpha Project.</p>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/checkout.js"></script>
</body>
</html>
